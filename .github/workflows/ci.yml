# Multi-OS smoke test: `bazel run //:refresh_all` extracts compile commands for
# this repo's own `print_args` cc_binary. That exercises the ProcessPoolExecutor
# worker path in refresh.template.py, which is the part that differs by platform:
# the start method is `fork` on Linux but `spawn` on macOS (Python 3.8+), and a
# `spawn` worker re-imports the entry point and re-enters main(). This job guards
# against that regression (BrokenProcessPool / "An attempt has been made to start
# a new process before the current process has finished its bootstrapping phase").
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-all:
    name: refresh_all (${{ matrix.os }}, bazel ${{ matrix.bazel }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS defaults multiprocessing to `spawn`; Linux to `fork`. We test
        # both so the fork/spawn divergence can never silently regress again.
        # Windows is intentionally omitted: it only offers `spawn`, which this
        # tool's Bazel-bootstrapped entry point does not currently support.
        os: [ubuntu-latest, macos-latest]
        # Latest patch of each supported major, so the extractor is exercised
        # against this repo's own code on every Bazel version we claim to
        # support. bazelisk has no "latest 8.x" wildcard -- bump as patches ship.
        bazel: [8.7.0, 9.0.2, 9.1.1]
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@v4

      # Pin the version in the file too, not only via USE_BAZEL_VERSION, so the
      # nested `bazel` calls the extractor spawns (aquery/cquery) can't fall back
      # to a different version if the env var ever fails to reach a subprocess.
      # The two mechanisms are set from the same matrix value and so agree.
      - name: Pin Bazel version
        run: echo "${{ matrix.bazel }}" > .bazelversion

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}-${{ matrix.bazel }}
          repository-cache: true

      - name: Extract compile commands
        run: bazel run //:refresh_all

      - name: Verify compile_commands.json
        shell: bash
        run: |
          test -s compile_commands.json
          python3 - <<'PY'
          import json
          with open("compile_commands.json") as f:
              entries = json.load(f)
          assert isinstance(entries, list) and entries, "compile_commands.json has no entries"
          assert any("print_args" in e.get("file", "") for e in entries), \
              "expected a compile command for print_args.cpp"
          print(f"OK: {len(entries)} entr{'y' if len(entries) == 1 else 'ies'}")
          PY

  # End-to-end system test of the extractor as a downstream consumer would use
  # it: a self-contained Bazel module (tests/integration/) depends on this repo
  # via local_path_override, builds a cc_library/cc_binary/cc_test plus a bash
  # test, then `bazel run :refresh` generates compile_commands.json which we
  # verify lists the expected files. Runs across the latest patch of each
  # supported Bazel major (see the `bazel` matrix below); the module works on
  # 8.x and 9.x alike.
  integration:
    name: integration (${{ matrix.os }}, bazel ${{ matrix.bazel }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Latest patch of each supported major. bazelisk has no "latest 8.x"
        # wildcard, so versions are pinned explicitly -- bump as patches ship.
        bazel: [8.7.0, 9.0.2, 9.1.1]
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    defaults:
      run:
        working-directory: tests/integration
    steps:
      - uses: actions/checkout@v4

      # Pinned in the file as well as via USE_BAZEL_VERSION (same matrix value),
      # so the extractor's nested `bazel` calls use the version under test even
      # if the env var fails to propagate. Writes tests/integration/.bazelversion
      # because of this job's working-directory default.
      - name: Pin Bazel version
        run: echo "${{ matrix.bazel }}" > .bazelversion

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-integration-${{ matrix.os }}-${{ matrix.bazel }}
          repository-cache: true

      - name: Build and run cc_library / cc_binary / cc_test / bash test
        run: bazel test //... --test_output=errors

      - name: Generate compile_commands.json
        # Delete any stale copy first so the verify step can only succeed
        # against output this run actually produced (guards a false green where
        # refresh emits nothing but a leftover file still satisfies verify).
        run: |
          rm -f compile_commands.json
          bazel run //:refresh

      - name: Verify expected files in compile_commands.json
        run: ./verify_compile_commands.sh

      - name: Generate compile_commands.json with --bcce-prefer-target-config
        # Same extraction, opting into exec-configuration deduplication. The
        # fixture compiles shared.cc in both configurations and toolonly.cc in
        # the exec configuration only, so this run pins both halves of the
        # contract: the duplicate goes, the exec-only file stays.
        run: |
          rm -f compile_commands.json
          bazel run //:refresh -- --bcce-prefer-target-config

      - name: Verify deduplicated compile_commands.json
        run: ./verify_compile_commands.sh --deduped

      # Covers what the tool writes into git: the --nobcce-update-gitignore /
      # `update_gitignore` opt-out, that we skip patterns git already ignores,
      # and that an unwritable .git warns rather than killing the run (which it
      # used to do, see issue #25). Runs against a throwaway git repository it
      # creates inside tests/integration, so this checkout's .git is untouched.
      - name: Verify gitignore behavior
        run: ./verify_gitignore_behavior.sh

  # Runs the hooks from .pre-commit-config.yaml. Without this job that config is
  # advisory: it only binds contributors who ran `pre-commit install` locally, so
  # a PR from anyone who did not can land whitespace/EOF/AST violations that the
  # hooks would have caught. Enforcing it here makes the config apply to every
  # PR, whoever opens it.
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1

  # A consumer may rename this module via `bazel_dep(..., repo_name = ...)`. A macro
  # that writes raw "@hedron_compile_commands//..." labels has them resolved in the
  # CALLER's repo context, so such a rename used to fail at analysis. Analysis of the
  # renamed module's `//:refresh` is enough to catch a regression - no extraction needed.
  repo-name:
    name: repo_name (${{ matrix.os }}, bazel ${{ matrix.bazel }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        bazel: [8.7.0, 9.1.1]
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    defaults:
      run:
        working-directory: tests/repo_name
    steps:
      - uses: actions/checkout@v4

      - name: Pin Bazel version
        run: echo "${{ matrix.bazel }}" > .bazelversion

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-repo-name-${{ matrix.os }}-${{ matrix.bazel }}
          repository-cache: true

      - name: Analyze the refresh target through the renamed repo
        run: bazel build //:refresh

  # Single, stable status check for branch protection. The matrix job names
  # ("refresh_all (ubuntu-latest)", etc.) change whenever the OS list changes,
  # so requiring each one individually is brittle. This gate aggregates them:
  # require only "CI done" and it stays correct as the matrix grows or shrinks.
  # `if: always()` makes it run even when a dependency fails or is cancelled
  # (without it, a failed dependency would skip the gate, which reads as green).
  ci-done:
    name: CI done
    if: always()
    needs: [refresh-all, integration, pre-commit, repo-name]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
